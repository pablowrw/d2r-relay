# Wydanie: git tag v1.2.0 && git push origin v1.2.0
# Buduje exe i instalator na Windowsie i dolacza je do wydania na GitHubie.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Budowanie
        shell: cmd
        run: |
          set PY_PYTHON3=3.13
          if "%GITHUB_REF_TYPE%"=="tag" set ISCC_DEFS=/DAppVersion=%GITHUB_REF_NAME:~1%
          call windows\build.bat
          if errorlevel 1 exit /b 1
          if not exist dist\D2R-Relay-setup.exe exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: D2R-Relay-windows
          path: |
            dist/D2R-Relay-setup.exe
            dist/D2R-Relay-windows.zip

      - name: Wydanie
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "D2R Relay ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            dist/D2R-Relay-setup.exe dist/D2R-Relay-windows.zip
